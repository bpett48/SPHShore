name: Build and publish SPHShore


on:
  workflow_dispatch:
  release:
    types: [published]


permissions:
  contents: read

jobs:
  wheels:
    name: Wheels - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v2.23
        env:
          CIBW_BUILD: 'cp310-* cp311-* cp312-* cp313-*'
          CIBW_SKIP: '*-musllinux_* *-win32 *-manylinux_i686'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error


  publish:
    if: github.event_name == 'release'
    name: Upload release to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest

    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/SPHShore
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*'
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist/
      # Must first configure PyPI Trusted Publisher for this GitHub repository,
      # workflow filename release.yml and environment pypi.
      - name: Publish to PyPI using OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
