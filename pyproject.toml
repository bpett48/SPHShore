[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SPHShore"
version = "0.1.1"
description = "C++ accelerated three-dimensional SPH wave tank with sloping shore and vertical pillars"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "SPHShore contributors"}]
keywords = ["SPH", "smoothed particle hydrodynamics", "waves", "wave tank", "fluid simulation", "coastal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.26.4,<2.3"]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine", "cibuildwheel>=2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.cibuildwheel]
# One can add ARM wheels later after numerical verification on those machines.
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/tests -q"

[tool.pytest.ini_options]
testpaths = ["tests"]
